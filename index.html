<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Dashboard | Baby Bella</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="music-toggle" id="music-toggle" type="button" aria-label="Play background music">Play music</button>

  <main class="page dashboard-page">
    <header class="dashboard-heading fade-up">
      <div class="eyebrow">A little timeline of us</div>
      <h1>Our months, our memories</h1>
      <p class="subtitle">Monthsary Dashboard</p>
    </header>

    <section class="dashboard-toolbar fade-up delay-1" aria-label="Project timeline">
      <div>
        <span class="timeline-label">OUR TIMELINE</span>
        <p id="month-summary" class="month-summary" aria-live="polite"></p>
      </div>
    </section>

    <section class="month-grid" id="month-grid" aria-label="Project months"></section>
    <p class="storage-note">Version 2.0.1 .</p>
  </main>

  <audio id="background-music" loop>
    <source src="music/naparabang.mp3" type="audio/mpeg">
  </audio>
  <script src="organizer.js"></script>
  <script src="music.js?v=3"></script>
</body>
</html>
